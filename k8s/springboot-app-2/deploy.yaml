

apiVersion: apps/v1
kind: Deployment

metadata:
  name: springboot-app-2
  namespace: prod

spec:
  replicas: 1

  selector:
    matchLabels:
      app: springboot-app-2

  template:
    metadata:
      labels:
        app: springboot-app-2

    spec:
      imagePullSecrets:
        - name: dockerhub-secret
      containers:
        - name: springboot-app-2
          image: rajvam6806/springboot-app-2:tagversion
          imagePullPolicy: Always

          ports:
            - containerPort: 8080

        
