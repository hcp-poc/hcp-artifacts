apiVersion: apps/v1
kind: Deployment

metadata:
  name: nextjs-app-2
  namespace: prod
spec:
  replicas: 1

  selector:
    matchLabels:
      app: nextjs-app-2

  template:
    metadata:
      labels:
        app: nextjs-app-2

    spec:
      imagePullSecrets:
        - name: dockerhub-secret
      containers:
        - name: nextjs-app-2
          image: rajvam6806/nextjs-app-2:tagversion
          imagePullPolicy: Always

          ports:
            - containerPort: 3000

          env:
            - name: NODE_ENV
              value: "production"
