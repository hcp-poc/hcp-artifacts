
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: springboot-app-1-secrets
  namespace: dev

spec:
  provider: gke
  parameters:
    secrets: |
      - resourceName: "projects/hcp-dev-project/secrets/dev-db-username/versions/latest"
        path: "DB_USERNAME"

      - resourceName: "projects/hcp-dev-project/secrets/dev-db-password/versions/latest"
        path: "DB_PASSWORD"

      - resourceName: "projects/hcp-dev-project/secrets/dev-db-host/versions/latest"
        path: "DB_HOST"

      - resourceName: "projects/hcp-dev-project/secrets/dev-db-name/versions/latest"
        path: "DB_NAME"

      - resourceName: "projects/hcp-dev-project/secrets/dev-api-key/versions/latest"
        path: "API_KEY"
