
apiVersion: apps/v1
kind: Deployment

metadata:
  name: springboot-app-1
  namespace: prod

spec:
  replicas: 1

  selector:
    matchLabels:
      app: springboot-app-1

  template:
    metadata:
      labels:
        app: springboot-app-1

    spec:
      imagePullSecrets:
        - name: dockerhub-secret
      containers:
        - name: springboot-app-1
          image: rajvam6806/springboot-app-1:tagversion
          imagePullPolicy: Always

          ports:
            - containerPort: 8080

        
